<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Widget</title>
<!-- nur Demo-Seite, gehört nicht ins Webflow-Embed -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); /* sonst weitet der Slider die Seite */ background: #fff; color: #0b1f4b; font-family: system-ui, sans-serif; }
  .tabs { display: flex; justify-content: center; gap: 8px; padding: 16px; }
  .tabs a { padding: 8px 18px; border-radius: 999px; color: inherit; text-decoration: none; font-weight: 600; font-size: 15px; }
  .tabs a[aria-current="page"] { background: #0b1f4b; color: #fff; }
  .tabs a:focus-visible { outline: 2px solid #0b1f4b; outline-offset: 2px; }
  .stage { display: flex; align-items: center; justify-content: center; width: min(100% - 32px, 1400px); margin: 0 auto; }
  .holes, .hole-nav, .dots { display: none; }
  /* Platzansicht: Slider Bahn 1–9 (Bahn-Infos | Grafik mittig), Wetter fest oben rechts neben der Grafik */
  body.view-platz .stage { --img-h: min(calc(100vh - 194px), 820px); display: block; position: relative; }
  body.view-platz .holes { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; }
  .holes::-webkit-scrollbar { display: none; }
  .holes:focus-visible { outline: 2px solid #0b1f4b; outline-offset: 4px; }
  .slide { flex: 0 0 100%; scroll-snap-align: start; display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; align-items: center; }
  .hole-img { height: var(--img-h); width: auto; max-width: 100%; }
  body.view-platz #weather-widget { position: absolute; top: 0; height: var(--img-h); display: flex; align-items: center; left: calc(50% + var(--img-h) * .4 + 32px); } /* .4 = halbe Bildbreite (896/1122 / 2) */
  /* 3D-Ansicht liegt über der Grafik der aktiven Bahn; 20 % größer, damit beim Drehen nichts abgeschnitten wird */
  .hole-3d { display: none; }
  body.view-platz .hole-3d { display: block; position: absolute; top: calc(var(--img-h) * -.1); left: 50%; width: calc(var(--img-h) * .7986 * 1.2); height: calc(var(--img-h) * 1.2); margin-left: calc(var(--img-h) * .7986 * -.6); pointer-events: none; opacity: 0; }
  body.view-platz .stage:not(.img-ready) #weather-widget { visibility: hidden; } /* Wetter erst zeigen, wenn die Bahn-Grafik geladen ist */
  body.view-platz #weather-widget .ww-col:first-child { display: none; } /* Platzstatus hier ausgeblendet */
  body.view-platz .hole-nav { display: grid; place-items: center; position: absolute; top: calc(var(--img-h) / 2); transform: translateY(-50%); width: 44px; height: 44px; border: 2px solid #0b1f4b; border-radius: 50%; background: #fff; color: #0b1f4b; font-size: 26px; line-height: 1; cursor: pointer; }
  .hole-nav.prev { left: 0; } .hole-nav.next { right: 0; }
  .hole-nav:disabled { opacity: .25; cursor: default; }
  body.view-platz .dots { display: flex; justify-content: center; gap: 0; margin-top: 36px; }
  /* Dots: 16px Klickfläche, sichtbar ein 8px-Punkt; inaktiv blass, aktiv voll */
  .dots button { width: 16px; height: 16px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
  .dots button::before { content: ""; display: block; width: 8px; height: 8px; margin: auto; border-radius: 50%; background: #0b1f4b; opacity: .2; transition: opacity .3s; }
  .dots button[aria-current="true"]::before { opacity: 1; }
  .hole-nav:focus-visible, .dots button:focus-visible { outline: 2px solid #0b1f4b; outline-offset: 2px; }
  .hole { justify-self: end; align-self: center; text-align: center; color: #0b1f4b; }
  .hole-nr { font-size: 56px; font-weight: 800; line-height: 1.1; padding-bottom: 12px; border-bottom: 2px solid currentColor; margin-bottom: 12px; }
  .hole-meta { font-size: 28px; font-weight: 700; line-height: 1.3; }
  .hole-name { display: inline-block; margin-top: 16px; padding: 4px 14px; border: 2px solid currentColor; border-radius: 999px; font-size: 16px; font-weight: 600; }
  /* Einblenden beim Wechsel zur Platzansicht: Bahn (Modell), dann Bahn-Angaben links, dann Wetter rechts.
     "backwards" statt "both": nach der Animation gelten wieder die Inline-Opacities des Sliders */
  @keyframes pv-in { from { opacity: 0; transform: translateY(16px); } }
  @keyframes pv-model { from { opacity: 0; transform: scale(.96); } }
  body.view-platz .hole > *, body.view-top .hole > * { animation: pv-in .6s cubic-bezier(.2,.7,.2,1) .5s backwards; } /* Titel, PAR, HCP, Name nacheinander */
  body.view-platz .hole > :nth-child(2), body.view-top .hole > :nth-child(2) { animation-delay: .62s; }
  body.view-platz .hole > :nth-child(3), body.view-top .hole > :nth-child(3) { animation-delay: .74s; }
  body.view-platz .hole > :nth-child(4), body.view-top .hole > :nth-child(4) { animation-delay: .86s; }
  body.view-platz .hole-img, body.view-platz .hole-3d, body.view-top .topview { animation: pv-model .8s cubic-bezier(.2,.7,.2,1) backwards; }
  body.view-platz #weather-widget, body.view-top #weather-widget { --ww-base: 1.2s; }
  @keyframes pv-fade { from { opacity: 0; } } /* nur Opacity: die Pfeile nutzen transform zur Zentrierung */
  body.view-platz .hole-nav, body.view-platz .dots { animation: pv-fade .6s ease 2.6s backwards; } /* Slider-Steuerung zuletzt, nach den Wetterdaten */
  @media (prefers-reduced-motion: reduce) { body.view-platz .hole > *, body.view-platz .hole-img, body.view-platz .hole-3d, body.view-platz .hole-nav, body.view-platz .dots, body.view-top .hole > *, body.view-top .topview { animation: none; } }
  .demo-ctrl { position: fixed; left: 16px; bottom: 12px; display: flex; gap: 16px; }
  .demo-ctrl button { padding: 0; border: 0; background: none; color: #0b1f4b; font: 500 11px system-ui, sans-serif; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; } /* Fußleiste einheitlich 11px wie die Quellenangabe */
  .demo-ctrl button:focus-visible { outline: 2px solid #0b1f4b; outline-offset: 2px; }
  /* Tab 3D-Ansicht: echtes 3D-Modell der Bahn */
  .model3d { display: none; }
  body.view-3d .model3d { display: block; position: fixed; inset: 70px 0 120px; } /* unten Platz für Uhrzeit-Slider und Hinweis */
  body.view-3d #weather-widget { position: fixed; top: 0; bottom: 0; right: 32px; display: flex; align-items: center; pointer-events: none; z-index: 1; }
  body.view-3d #weather-widget .ww-col:first-child { display: none; } /* Platzstatus hier ausgeblendet */
  .model3d canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  .model3d canvas:active { cursor: grabbing; }
  .model3d-hint { position: absolute; left: 0; right: 0; bottom: -112px; /* unter der Canvas, auf Höhe der Demo-Links */ margin: 0; text-align: center; font-size: 11px; opacity: .6; }
  /* Kompass im Stil der Wetterdaten (Variante .ww-stack): Icon links, Wert fett, Subline darunter */
  .compass { position: absolute; top: 16px; right: 32px; display: grid; grid-template-columns: 56px auto; column-gap: 16px; align-items: center; color: #0b1f4b; font-variant-numeric: tabular-nums; }
  .compass-icon { grid-row: span 2; width: 56px; height: 56px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }
  .compass-value { align-self: end; min-width: 4.5em; font-size: 28px; font-weight: 800; line-height: 1.15; }
  .compass-label { align-self: start; font-size: 15px; line-height: 1.4; }
  /* Uhrzeit-Slider für den Sonnenstand */
  .daytime { position: absolute; left: 50%; bottom: -84px; width: min(420px, calc(100% - 32px)); transform: translateX(-50%); color: #0b1f4b; font-variant-numeric: tabular-nums; }
  /* Tab Topview: statische Draufsicht, Bahn-Angaben links und Wetter rechts wie in der Tiefenansicht */
  .top-only { display: none; }
  body.view-top .stage { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; align-items: center; }
  body.view-top .top-only { display: block; }
  body.view-top .topview { height: min(calc(100vh - 140px), 1100px); width: auto; }
  body.view-top #weather-widget { justify-self: start; }
  body.view-top #weather-widget .ww-col:first-child { display: none; }
  body.view-brand .daytime { display: none; } /* Netz-Ansicht ist unbeleuchtet: kein Sonnenstand */
  body.view-brand .model3d { bottom: 40px; }
  body.view-brand .model3d-hint { bottom: -32px; }
  .flyover { position: absolute; top: 16px; left: 32px; padding: 8px 18px; border: 2px solid #0b1f4b; border-radius: 999px; background: #fff; color: #0b1f4b; font: 600 15px system-ui, sans-serif; cursor: pointer; }
  .flyover:hover:not(:disabled) { background: #0b1f4b; color: #fff; }
  .flyover { display: inline-flex; align-items: center; gap: 8px; }
  .flyover.busy { cursor: progress; opacity: .7; }
  .flyover.busy::before { content: ""; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: fly-spin .8s linear infinite; }
  @keyframes fly-spin { to { transform: rotate(360deg); } }
  .flyover:focus-visible { outline: 2px solid #0b1f4b; outline-offset: 3px; }
  body.view-brand .flyover { display: none; } /* nur in der 3D-Ansicht */
  .daytime-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .daytime-head strong { font-size: 20px; font-weight: 800; }
  .daytime-head button { margin-left: auto; padding: 0; border: 0; background: none; color: inherit; font: 500 11px system-ui, sans-serif; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; } /* Fußleiste einheitlich 11px wie die Quellenangabe */
  .daytime-track { position: relative; padding-bottom: 20px; }
  .daytime input { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 6px; margin: 0; border-radius: 3px; background: var(--dt-grad, #d6dbe6); cursor: pointer; }
  .daytime input::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border: 3px solid #fff; border-radius: 50%; background: #0b1f4b; box-shadow: 0 0 0 1px #0b1f4b; }
  .daytime input::-moz-range-thumb { width: 12px; height: 12px; border: 3px solid #fff; border-radius: 50%; background: #0b1f4b; box-shadow: 0 0 0 1px #0b1f4b; }
  .daytime input:focus-visible { outline: 2px solid #0b1f4b; outline-offset: 4px; }
  .dt-mark { position: absolute; top: 12px; transform: translateX(-50%); font-size: 12px; white-space: nowrap; opacity: .75; pointer-events: none; }
  .dt-mark::before { content: ""; position: absolute; left: 50%; top: -9px; width: 1px; height: 7px; background: currentColor; }
  #wind-bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
  body:not(.view-platz) #wind-bg { display: none; }
</style>
</head>
<body>
<canvas id="wind-bg" aria-hidden="true"></canvas>
<nav class="tabs" aria-label="Ansicht">
  <a href="#">Übersicht</a>
  <a href="#top">Topview</a>
  <a href="#platz">Tiefenansicht</a>
  <a href="#3d">3D-Ansicht</a>
  <a href="#brand">Branded</a>
</nav>
<main class="stage">
<div class="hole top-only">
  <div class="hole-nr">Bahn 1</div>
  <div class="hole-meta">PAR 4</div>
  <div class="hole-meta">HCP 3/4</div>
  <div class="hole-name">Achtern Diek</div>
</div>
<img class="topview top-only" src="topview.png" alt="Draufsicht der Bahn mit Fairway, Teich und Bunkern">
<div class="holes" id="holes" tabindex="0" aria-label="Bahnen 1 bis 9">
<section class="slide" aria-label="Bahn 1">
<div class="hole">
  <div class="hole-nr">Bahn 1</div>
  <div class="hole-meta">PAR 4</div>
  <div class="hole-meta">HCP 3/4</div>
  <div class="hole-name">Achtern Diek</div>
</div>
<img class="hole-img" src="https://static.wixstatic.com/media/e2e33d_b3aa1c2913e8482aa0509369f674eea9~mv2.png/v1/crop/x_31,y_0,w_1199,h_1500/fill/w_896,h_1122,al_c,q_90,usm_0.66_1.00_0.01,enc_avif,quality_auto/3d-perspektive-lc.png" alt="3D-Ansicht von Bahn 1, Achtern Diek">
</section>
</div>
<button class="hole-nav prev" type="button" aria-label="Vorherige Bahn">‹</button>
<button class="hole-nav next" type="button" aria-label="Nächste Bahn">›</button>
<div class="dots" id="dots"></div>
<!-- Webflow: alles zwischen START und END in ein Embed-Element kopieren -->
<!-- START weather-widget -->
<div id="weather-widget">
  <div class="ww-card" aria-live="polite">
    <div class="ww-col">
      <!-- Platzstatus: Ampel, unterster Kreis gefüllt = grün/geöffnet. shortcut: fest eingetragen, später aus CMS/Feld in Webflow befüllen -->
      <svg class="ww-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="2.5" width="9" height="19" rx="3"/><circle cx="12" cy="6.75" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="17.25" r="1.4" fill="currentColor"/></svg>
      <div class="ww-value">Offen</div>
      <div class="ww-label">bis 17:00 Uhr</div>
    </div>
    <div class="ww-col">
      <svg class="ww-icon" id="ww-weather-icon" viewBox="0 0 24 24" aria-hidden="true"></svg>
      <div class="ww-value" id="ww-temp" role="img" aria-label="Temperatur"></div>
      <div class="ww-label" id="ww-desc"></div>
    </div>
    <div class="ww-col">
      <svg class="ww-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/></svg>
      <div class="ww-value" id="ww-wind" role="img" aria-label="Wind"></div>
      <div class="ww-label" id="ww-dir"></div>
    </div>
  </div>
  <div class="ww-foot" id="ww-foot">Modell: Schloss Breitenburg · Messung: DWD Itzehoe</div>
</div>
<style>
  #weather-widget { --ww-navy: #0b1f4b; --ww-skel: rgba(11,31,75,.08); width: 100%; max-width: 760px; color: var(--ww-navy); font-family: system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  #weather-widget .ww-card { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; padding: 40px; text-align: center; }
  #weather-widget .ww-icon { display: block; margin: 0 auto; width: 112px; height: 112px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  #weather-widget .ww-value { font-size: 39px; font-weight: 800; margin-top: 8px; height: 1.15em; line-height: 1.15em; }
  #weather-widget .ww-label { font-size: 20px; height: 1.4em; line-height: 1.4em; }
  /* Skeleton: leere Felder zeigen Platzhalter in fester Größe, damit die Card beim Laden nicht springt */
  @keyframes ww-pulse { to { opacity: .4; } }
  #weather-widget .ww-value:empty, #weather-widget .ww-label:empty { display: flow-root; } /* verhindert, dass der Balken-Margin nach außen kollabiert */
  #weather-widget .ww-value:empty::before, #weather-widget .ww-label:empty::before { content: ""; display: block; margin: .15em auto; height: calc(100% - .3em); border-radius: 6px; background: var(--ww-skel); animation: ww-pulse .8s ease-in-out infinite alternate; }
  #weather-widget .ww-value:empty::before { width: 3.5em; }
  #weather-widget .ww-label:empty::before { width: 5em; }
  #weather-widget .ww-icon:empty { background: radial-gradient(circle, var(--ww-skel) 55%, transparent 56%); }
  #weather-widget .ww-foot { position: fixed; right: 16px; bottom: 12px; font-size: 11px; opacity: .6; }
  /* Odometer: jede Ziffer ist ein senkrechter 0–9-Streifen, der per translateY rollt */
  #weather-widget .ww-odo { white-space: pre; }
  #weather-widget .ww-odo > span { display: inline-block; vertical-align: top; height: 1.15em; line-height: 1.15em; overflow: hidden; }
  #weather-widget .ww-d > span { display: block; transition: transform .9s cubic-bezier(.2,.7,.2,1); }
  /* Intro: Icon, Hauptwert, Subline gleiten nacheinander hoch; Spalten leicht versetzt */
  @keyframes ww-up { from { opacity: 0; transform: translateY(16px); } }
  #weather-widget .ww-col > * { animation: ww-up .6s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--ww-base, 0s) + var(--ww-c, 0s)); } /* --ww-base: optionaler Start-Versatz von außen */
  #weather-widget .ww-col:nth-child(2) { --ww-c: .2s; }
  #weather-widget .ww-col:nth-child(3) { --ww-c: .4s; }
  #weather-widget .ww-col > :nth-child(2) { animation-delay: calc(var(--ww-base, 0s) + var(--ww-c, 0s) + .12s); }
  #weather-widget .ww-col > :nth-child(3) { animation-delay: calc(var(--ww-base, 0s) + var(--ww-c, 0s) + .24s); }
  /* Variante .ww-stack: Werte untereinander, Icon links neben Wert + Subline */
  #weather-widget.ww-stack { width: auto; }
  #weather-widget.ww-stack .ww-card { grid-template-columns: auto; gap: 24px; padding: 0; text-align: left; }
  #weather-widget.ww-stack .ww-col { display: grid; grid-template-columns: 56px auto; column-gap: 16px; align-items: center; }
  #weather-widget.ww-stack .ww-icon { grid-row: span 2; width: 56px; height: 56px; }
  #weather-widget.ww-stack .ww-value { margin-top: 0; align-self: end; font-size: 28px; }
  #weather-widget.ww-stack .ww-label { align-self: start; font-size: 15px; }
  #weather-widget.ww-stack .ww-value:empty::before, #weather-widget.ww-stack .ww-label:empty::before { margin-left: 0; }
  @media (prefers-reduced-motion: reduce) { #weather-widget .ww-d > span { transition: none; } #weather-widget .ww-col > * { animation: none; } }
</style>
<script>
(function () {
  // Modell: Open-Meteo am Schloss Breitenburg (OSM-Koordinaten); Messung: DWD-Station Itzehoe 02429 via Bright Sky. Beide ohne API-Key.
  var MODEL_URL = 'https://api.open-meteo.com/v1/forecast?latitude=53.9061&longitude=9.5667&current=temperature_2m,weather_code,is_day,wind_speed_10m,wind_direction_10m&wind_speed_unit=ms&timezone=Europe%2FBerlin';
  var STATION_URL = 'https://api.brightsky.dev/current_weather?dwd_station_id=02429';
  var REFRESH_MS = 5 * 60 * 1000; // Quellen aktualisieren alle 10–15 min, 5 min reicht

  var cloud = '<path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 11.1 3.5 3.5 0 0 0 7 18z"/>';
  var cloudUp = '<path d="M7 15h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 8.1 3.5 3.5 0 0 0 7 15z"/>';
  var ICONS = {
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
    partly: '<path d="M8 2v1.5M3.5 4.5l1 1M2 9h1.5M12.5 4.5l-1 1M5.3 11.5A3.5 3.5 0 0 1 11 6"/>' + cloud,
    cloud: cloud,
    fog: '<path d="M4 9h16M3 13h18M5 17h14"/>',
    rain: cloudUp + '<path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
    snow: cloudUp + '<path d="M8 19h.01M12 21h.01M16 19h.01M10 21h.01M14 19h.01"/>',
    thunder: cloudUp + '<path d="M13 15l-2 4h3l-2 4"/>'
  };
  // WMO-Wettercodes -> [Icon, Text]
  function weather(code, isDay) {
    if (code <= 1) return [isDay ? 'sun' : 'moon', 'Klar'];
    if (code === 2) return ['partly', 'Teils bewölkt'];
    if (code === 3) return ['cloud', 'Bewölkt'];
    if (code <= 48) return ['fog', 'Nebel'];
    if (code <= 67 || (code >= 80 && code <= 82)) return ['rain', 'Regen'];
    if (code <= 86) return ['snow', 'Schnee'];
    return ['thunder', 'Gewitter'];
  }
  var DIRS = ['N', 'NO', 'O', 'SO', 'S', 'SW', 'W', 'NW'];
  var $ = function (id) { return document.getElementById(id); };

  // Mittel aus beiden Quellen; fehlt eine, zählt nur die andere
  function avg(vals) {
    vals = vals.filter(function (v) { return v != null; });
    return vals.length ? vals.reduce(function (s, v) { return s + v; }, 0) / vals.length : null;
  }
  // Richtungen als Einheitsvektoren mitteln, sonst ergäbe 350° + 10° fälschlich 180°
  // shortcut: bei genau entgegengesetzten Richtungen ist das Ergebnis zufällig; bei 2 Quellen in der Praxis egal
  function avgDir(vals) {
    vals = vals.filter(function (v) { return v != null; });
    if (!vals.length) return null;
    var x = 0, y = 0;
    vals.forEach(function (d) { x += Math.cos(d * Math.PI / 180); y += Math.sin(d * Math.PI / 180); });
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }
  console.assert(Math.round(avgDir([350, 10])) % 360 === 0 && avgDir([90, 180]) === 135 && avg([1, null]) === 1, 'weather-widget: Mittelwert fehlerhaft');

  // Odometer: Ziffern rollen, andere Zeichen werden direkt gesetzt
  var STRIP = '<span>' + '0123456789'.split('').join('<br>') + '</span>';
  function odo(el, text) {
    el.classList.add('ww-odo');
    el.setAttribute('aria-label', text);
    var kids = el.children;
    var same = kids.length === text.length && [].every.call(kids, function (k, i) {
      return k.classList.contains('ww-d') === /\d/.test(text[i]);
    });
    if (!same) {
      el.textContent = '';
      for (var i = 0; i < text.length; i++) {
        var s = document.createElement('span');
        if (/\d/.test(text[i])) { s.className = 'ww-d'; s.innerHTML = STRIP; }
        s.setAttribute('aria-hidden', 'true');
        el.appendChild(s);
      }
      el.offsetWidth; // Reflow, damit neue Ziffern sichtbar von 0 hochrollen
    }
    for (var j = 0; j < text.length; j++) {
      var k = kids[j];
      if (k.className === 'ww-d') k.firstChild.style.transform = 'translateY(' + (-1.15 * text[j]) + 'em)';
      else k.textContent = text[j];
    }
  }

  var getJson = function (url) {
    return fetch(url).then(function (r) { return r.json(); }).catch(function () { return null; });
  };

  // Werte anzeigen; v = { temp °C, speed m/s, dir Grad (woher), code WMO, isDay }
  function render(v) {
    if (v.code != null) {
      var w = weather(v.code, v.isDay);
      $('ww-weather-icon').innerHTML = ICONS[w[0]];
      $('ww-desc').textContent = w[1];
    }
    odo($('ww-temp'), v.temp == null ? '–' : (Math.round(v.temp) || 0) + ' °C'); // || 0 vermeidet "-0"
    odo($('ww-wind'), v.speed == null ? '–' : v.speed.toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' m/s');
    $('ww-dir').textContent = v.dir == null ? 'Wind' : 'aus ' + DIRS[Math.round(v.dir / 45) % 8];

    // weatherWidget.wind hält den letzten Wert für Skripte, die erst nach dem Event laden
    $('weather-widget').dispatchEvent(new CustomEvent('ww:update', { bubbles: true, detail: weatherWidget.current = v }));

  var real = null, override = null;
  window.weatherWidget = {
    show: function (v) { override = v; render(v); },
    reset: function () { override = null; if (real) render(real); }
  };

  function load() {
    Promise.all([getJson(MODEL_URL), getJson(STATION_URL)]).then(function (res) {
      var m = res[0] && res[0].current, s = res[1] && res[1].weather;
      if (!m && !s) { // Skeleton durch Fehlerzustand ersetzen, Werte bleiben stehen falls schon vorhanden

        if (!$('ww-desc').hasChildNodes()) $('ww-desc').textContent = 'Keine Daten';
        if (!$('ww-dir').hasChildNodes()) $('ww-dir').textContent = 'Wind';
        return;
      }
      m = m || {}; s = s || {};

      real = {
        temp: avg([m.temperature_2m, s.temperature]),
        speed: avg([m.wind_speed_10m, s.wind_speed_10 == null ? null : s.wind_speed_10 / 3.6]), // Bright Sky liefert km/h
        dir: avgDir([m.wind_direction_10m, s.wind_direction_10]),
        code: m.weather_code, isDay: m.is_day
      };
      if (!override) render(real);
      $('ww-foot').textContent = 'Modell: Schloss Breitenburg · Messung: DWD Itzehoe' + (s.timestamp
        ? ', ' + new Date(s.timestamp).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr' : '');
    });
  }

  load();
  setInterval(load, REFRESH_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();

// Sonnenstand (vereinfachte Astronomie-Formeln, Genauigkeit ~1°): alt = Höhe, az = Azimut ab Norden im Uhrzeigersinn, beides Radiant
function sunPos(date, lat, lon) {
  var r = Math.PI / 180, d = date / 864e5 - 10957.5; // Tage seit 1.1.2000 12:00 UTC

        var NX = 110, NZ = Math.round(NX * D / W), pts = [], seg = function (u1, v1, u2, v2) {
          if (!inside(u1, v1) || !inside(u2, v2)) return;
          pts.push(X(u1), Y(u1, v1) + 0.005, Z(v1), X(u2), Y(u2, v2) + 0.005, Z(v2));
          tint(ink(u1, v1)); tint(ink(u2, v2));
        };
        for (var iz = 0; iz <= NZ; iz++) for (var ix = 0; ix <= NX; ix++) {
          var u = ix / NX, v = iz / NZ;
          if (ix < NX) seg(u, v, (ix + 1) / NX, v);
          if (iz < NZ) seg(u, v, u, (iz + 1) / NZ);
        }
        var grid = new THREE.BufferGeometry(); grid.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
        grid.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
        group.add(new THREE.LineSegments(grid, new THREE.LineBasicMaterial({ vertexColors: true })));
        // Umriss kräftig: obere Kante auf Geländehöhe, untere Kante als Sockel
        var top = [], bottom = [];
        poly.forEach(function (p) { top.push(new THREE.Vector3(X(p[0]), Y(p[0], p[1]), Z(p[1]))); bottom.push(new THREE.Vector3(X(p[0]), -0.15, Z(p[1]))); });
        group.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(top), line(1)));
        group.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(bottom), line(0.4)));
        // Untergrund: Umriss als Fläche in Navy 10 %, auf Sockelhöhe unter dem Gitter (schneidet so nirgends das Gelände)
        var base = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(poly.map(function (p) { return new THREE.Vector2(X(p[0]), -Z(p[1])); }))),
          new THREE.MeshBasicMaterial({ color: NAVY, transparent: true, opacity: 0.1, depthWrite: false, side: THREE.DoubleSide }));
        base.rotation.x = -Math.PI / 2; base.position.y = -0.15; group.add(base);
        // Wasser als zarte Navy-Fläche
        var wGeo = new THREE.PlaneGeometry(W, D); wGeo.rotateX(-Math.PI / 2);
        var water = new THREE.Mesh(wGeo, new THREE.MeshBasicMaterial({ color: NAVY, alphaMap: load(dir + 'water.png'), transparent: true, opacity: 0.12, depthWrite: false }));
        water.position.y = -0.04; group.add(water);
        // Bäume als Drahtgitter-Kronen
        var m4 = new THREE.Matrix4(), q = new THREE.Quaternion();
        var crowns = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), new THREE.MeshBasicMaterial({ color: NAVY, wireframe: true, transparent: true, opacity: 0.3 }), d.trees.length);
        d.trees.forEach(function (t, i) {
          var r = t[2] * W * 1.25, x = X(t[0]), z = Z(t[1]), y = Y(t[0], t[1]);
          crowns.setMatrixAt(i, m4.compose(new THREE.Vector3(x, y + r * 1.7, z), q.setFromEuler(new THREE.Euler(0, i, 0)), new THREE.Vector3(r, r * 1.15, r)));
        });
        group.add(crowns);
        // Fahne in Navy (weht wie in der 3D-Ansicht)
        var fx = X(d.flag[0]), fz = Z(d.flag[1]), fy = Y(d.flag[0], d.flag[1]);
        group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(fx, fy, fz), new THREE.Vector3(fx, fy + 0.5, fz)]), line(1)));
        var fGeo = new THREE.PlaneGeometry(0.16, 0.1, 10, 1); fGeo.translate(0.08, -0.05, 0);
        var flag = new THREE.Mesh(fGeo, new THREE.MeshBasicMaterial({ color: NAVY, side: THREE.DoubleSide }));
        flag.position.set(fx, fy + 0.5, fz); group.add(flag);
        mdl.flag = flag; mdl.flagX = Float32Array.from(fGeo.attributes.position.array.filter(function (_, i) { return i % 3 === 0; }));
      }

      // Gelände: fein unterteilte Fläche, Höhe per Displacement, Umriss per Alpha der Textur
      var gGeo = new THREE.PlaneGeometry(W, D, 300, Math.round(300 * D / W)); gGeo.rotateX(-Math.PI / 2);
      var ground = new THREE.Mesh(gGeo, new THREE.MeshStandardMaterial({
        map: load(dir + 'ground.png', true), displacementMap: load(dir + 'height.png'),
        displacementScale: DISP, displacementBias: -DISP / 2, alphaTest: 0.5, roughness: 0.95
      }));
      ground.receiveShadow = true; group.add(ground);

      // Erdsockel: nur die Seitenwände des extrudierten Umrisses (Deckel unsichtbar, sonst verdeckt er Wasser/Bunker)
      var shape = new THREE.Shape(d.outline.map(function (p) { return new THREE.Vector2(X(p[0]), -Z(p[1])); }));
      var slab = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.15, bevelEnabled: false }),
        [new THREE.MeshBasicMaterial({ visible: false }), new THREE.MeshStandardMaterial({ color: C(0x6b4b2e), roughness: 1 })]);
      slab.rotation.x = -Math.PI / 2; slab.position.y = -0.15; group.add(slab);

      // Wasser: halbtransparente Fläche knapp unter Normalniveau, Form aus water.png
      var wGeo = new THREE.PlaneGeometry(W, D); wGeo.rotateX(-Math.PI / 2);
      var water = new THREE.Mesh(wGeo, new THREE.MeshStandardMaterial({
        color: C(0x2a7fb8), alphaMap: load(dir + 'water.png'), transparent: true, opacity: 0.85, roughness: 0.15, metalness: 0.1, depthWrite: false
      }));
      water.position.y = -0.04; group.add(water);

      // Bäume: instanziert (Stamm + Krone), Größe aus der Illustration, Farbe leicht variiert
      var n = d.trees.length, m4 = new THREE.Matrix4(), col = new THREE.Color(), rnd = function (a, b) { return a + Math.random() * (b - a); };
      var trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.1, 0.14, 1, 6), new THREE.MeshStandardMaterial({ color: C(0x5a4030), roughness: 1 }), n);
      var crowns = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), new THREE.MeshStandardMaterial({ flatShading: true, roughness: 0.9 }), n);
      d.trees.forEach(function (t, i) {
        var r = t[2] * W * 1.25, x = X(t[0]), z = Z(t[1]), y = Y(t[0], t[1]), th = r * 0.9;
        trunks.setMatrixAt(i, m4.compose(new THREE.Vector3(x, y + th / 2, z), new THREE.Quaternion(), new THREE.Vector3(r * 0.5, th, r * 0.5)));
        var q = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, rnd(0, 6.3), 0));
        crowns.setMatrixAt(i, m4.compose(new THREE.Vector3(x, y + th + r * 0.8, z), q, new THREE.Vector3(r, r * rnd(1, 1.3), r)));
        crowns.setColorAt(i, col.setHSL(rnd(0.22, 0.33), rnd(0.4, 0.6), rnd(0.18, 0.3)).convertSRGBToLinear()); // Farben wie im Bild (sRGB) angeben
      });
      [trunks, crowns].forEach(function (o) { o.castShadow = o.receiveShadow = true; group.add(o); });

      // Hütte (achteckiger Pavillon, falls in der Illustration) und Fahne auf dem Grün
      if (d.hut) {
      var hut = new THREE.Group(), hx = X(d.hut[0]), hz = Z(d.hut[1]), hy = Y(d.hut[0], d.hut[1]);
      var walls = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.14, 8), new THREE.MeshStandardMaterial({ color: C(0xe8dcc4) }));
      var roof = new THREE.Mesh(new THREE.ConeGeometry(0.19, 0.13, 8), new THREE.MeshStandardMaterial({ color: C(0xa8432a), flatShading: true }));
      walls.position.y = 0.07; roof.position.y = 0.205; hut.add(walls, roof);
      hut.children.forEach(function (o) { o.castShadow = o.receiveShadow = true; });
      hut.position.set(hx, hy, hz); group.add(hut);
      }
      var fx = X(d.flag[0]), fz = Z(d.flag[1]), fy = Y(d.flag[0], d.flag[1]);
      var pin = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.5, 6), new THREE.MeshStandardMaterial({ color: 0xffffff }));
      pin.position.set(fx, fy + 0.25, fz); pin.castShadow = true;
      // Fahne als unterteiltes Rechteck (Mast an x = 0), damit sie im Wind wehen kann
      var fGeo = new THREE.PlaneGeometry(0.16, 0.1, 10, 1); fGeo.translate(0.08, -0.05, 0);
      var flag = new THREE.Mesh(fGeo, new THREE.MeshStandardMaterial({ color: C(0xd93a2b), side: THREE.DoubleSide }));
      flag.position.set(fx, fy + 0.5, fz); flag.castShadow = true;
      mdl.flag = flag; mdl.flagX = Float32Array.from(fGeo.attributes.position.array.filter(function (_, i) { return i % 3 === 0; }));
      group.add(pin, flag);
    });
    }


    // Wind im Modell: kurze helle Striche, die in Windrichtung über die Bahn ziehen (Weltkoordinaten: Norden = -z, Osten = +x),
    // dadurch reagieren sie von selbst auf Drehung und Neigung der Kamera
    // (schmale Quader statt Linien: WebGL zeichnet Linien immer nur 1 px breit)
    var N = 450, LIFE = 2.5, wv = new THREE.Vector3(), streaks = [], flag, flagX, windSpeed = 0, HW = 7, HD = 9;
    var sMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.018, 0.008, 1),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.45, depthWrite: false }), N);
    scene.add(sMesh);
    var sM = new THREE.Matrix4(), sP = new THREE.Vector3(), sQ = new THREE.Quaternion(), sS = new THREE.Vector3(1, 1, 1), up = new THREE.Vector3(0, 1, 0);
    var spawn = function (st) { st.x = (Math.random() * 2 - 1) * HW; st.z = (Math.random() * 2 - 1) * HD; st.y = 0.25 + Math.random() * 1.2; st.age = 0; st.life = LIFE * (0.6 + Math.random() * 0.8); return st; };
    for (var k = 0; k < N; k++) { streaks.push(spawn({})); streaks[k].age = Math.random() * streaks[k].life; }
    function setWind(w) {
      var b = (w.dir + 180) * Math.PI / 180; // "aus NO" strömt nach SW
      var v = 0.4 + Math.min(w.speed || 0, 15) * 0.18;
      wv.set(Math.sin(b) * v, 0, -Math.cos(b) * v);
      sQ.setFromAxisAngle(up, Math.atan2(wv.x, wv.z)); // Streifen entlang der Windrichtung ausrichten
      windSpeed = Math.min(w.speed || 0, 15);
    }
    // Fahne zeigt in Windrichtung (lokal +x → wv) und flattert: Welle läuft vom Mast nach außen, stärker bei mehr Wind
    function flutter(now) {
      if (!flag) return;
      flag.rotation.y = Math.atan2(-wv.z, wv.x) + Math.sin(now / 900) * 0.08;
      var pos = flag.geometry.attributes.position, t = now / 1000, amp = 0.004 + windSpeed * 0.0016, f = 5 + windSpeed * 0.9;
      for (var i = 0; i < pos.count; i++) { var x = flagX[i]; pos.setZ(i, Math.sin(x * 40 - t * f) * amp * (x / 0.16)); }
      pos.needsUpdate = true; flag.geometry.computeVertexNormals();
    }
    if (weatherWidget.wind) setWind(weatherWidget.wind);
    document.addEventListener('ww:wind', function (e) { setWind(e.detail); });
    var lastT = performance.now();
    function wind() {
      var now = performance.now(), dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
      for (var i = 0; i < N; i++) {
        var st = streaks[i];
        st.age += dt; st.x += wv.x * dt; st.z += wv.z * dt;
        if (st.age > st.life || Math.abs(st.x) > HW || Math.abs(st.z) > HD) spawn(st);
        var len = 0.7 * Math.sin(Math.PI * st.age / st.life) * Math.min(1, wv.length()); // wächst beim Entstehen, schrumpft vor dem Verschwinden
        sP.set(st.x, st.y, st.z); sS.z = Math.max(len, 0.0001);
        sMesh.setMatrixAt(i, sM.compose(sP, sQ, sS));
      }
      sMesh.instanceMatrix.needsUpdate = true;
      flutter(now);
    }

    (function frame() {
      requestAnimationFrame(frame);
      if (!document.body.classList.contains('view-3d')) return;
      wind();
      var w = canvas.clientWidth, h = canvas.clientHeight;
      if (canvas.width !== Math.round(w * renderer.getPixelRatio()) || canvas.height !== Math.round(h * renderer.getPixelRatio())) {
        renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
      }
      if (queue.length) {
        var a = queue[0], e = Math.min(1, (performance.now() - aStart) / (a.dur * 1000));
        a.fn((a.ease || ease)(e)); camera.lookAt(controls.target);
        if (e >= 1) { queue.shift(); aStart = performance.now(); if (!queue.length) { controls.enabled = true; controls.update(); busy(false); } }
      } else controls.update();
      compass();
      renderer.render(scene, camera);
    })();

    // Kompass: Blickrichtung (Himmelsrichtung + Grad) und Neigung (0° = senkrecht von oben)
    // shortcut: Norden = oben in der Illustration angenommen; echte Ausrichtung der Bahn per NORTH (Grad) korrigieren
    var NORTH = 0, DIRS = ['N', 'NO', 'O', 'SO', 'S', 'SW', 'W', 'NW'], last = '', look = new THREE.Vector3();
    var rose = document.getElementById('compass-rose'), dirEl = document.getElementById('compass-dir'), tiltEl = document.getElementById('compass-tilt');
    function compass() {
      if (!look) return; // erster Frame läuft, bevor die Kompass-Variablen gesetzt sind
      camera.getWorldDirection(look);
      var hdg = Math.round((Math.atan2(look.x, -look.z) * 180 / Math.PI + NORTH + 360) % 360);
      var tilt = Math.round(Math.acos(Math.min(1, -look.y)) * 180 / Math.PI); // aus der Blickrichtung, stimmt auch beim Überflug
      if (hdg + '/' + tilt === last) return;
      last = hdg + '/' + tilt;
      dirEl.textContent = DIRS[Math.round(hdg / 45) % 8] + ' ' + hdg + '°';
      tiltEl.textContent = 'Neigung ' + tilt + '°';
      // Nadel zeigt nach Norden; je flacher der Blick, desto stärker wird die Rose gestaucht
      rose.setAttribute('transform', 'translate(12 12) scale(1 ' + Math.max(0.25, Math.cos(tilt * Math.PI / 180)).toFixed(3) + ') rotate(' + (-hdg) + ') translate(-12 -12)');
    }
  }
  function check() { if (location.hash === '#3d' || location.hash === '#brand') { init(); showModel(location.hash); } }
  addEventListener('hashchange', check);
  check();
})();

// Demo: Zufallswerte / zurück auf echte Wetterdaten
(function () {
  var CODES = [0, 2, 3, 45, 61, 71, 95]; // klar, teils bewölkt, bewölkt, Nebel, Regen, Schnee, Gewitter
  var pick = function (a) { return a[Math.floor(Math.random() * a.length)]; };
  document.getElementById('randomize').onclick = function () {
    weatherWidget.show({
      temp: Math.round(Math.random() * 35 - 5),
      speed: Math.round(Math.random() * 150) / 10,
      dir: Math.floor(Math.random() * 360),
      code: pick(CODES), isDay: Math.random() < .7 ? 1 : 0
    });
  };
  document.getElementById('reset').onclick = function () { weatherWidget.reset(); document.dispatchEvent(new Event('demo:reset')); }; // auch Kamera + Uhrzeit
})();

// Bahn-Slider: Bahn 1 wird für 2–9 dupliziert (shortcut: gleicher Inhalt, später echte Daten je Bahn)
(function () {
  var track = document.getElementById('holes'), dots = document.getElementById('dots');
  var first = track.querySelector('.slide');
  for (var n = 2; n <= 9; n++) {
    var s = first.cloneNode(true);
    s.setAttribute('aria-label', 'Bahn ' + n);
    s.querySelector('.hole-nr').textContent = 'Bahn ' + n;
    s.querySelector('.hole-img').alt = '3D-Ansicht von Bahn ' + n;
    track.appendChild(s);
  }
  var slides = track.children, prev = document.querySelector('.hole-nav.prev'), next = document.querySelector('.hole-nav.next');
  [].forEach.call(slides, function (s, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.setAttribute('aria-label', 'Bahn ' + (i + 1));
    b.onclick = function () { go(i); };
    dots.appendChild(b);
  });
  var current = function () { return Math.round(track.scrollLeft / track.clientWidth) || 0; };
  function go(i) { track.scrollTo({ left: i * track.clientWidth }); }
  var idx = 0;
  function update() {
    var i = idx = current();
    [].forEach.call(dots.children, function (b, j) { b.setAttribute('aria-current', j === i); });
    prev.disabled = i === 0; next.disabled = i === slides.length - 1;
  }
  prev.onclick = function () { go(current() - 1); };
  next.onclick = function () { go(current() + 1); };
  track.addEventListener('scroll', update, { passive: true });

  // Wetter-Widget und 3D-Ansicht gibt es nur einmal: beim Wischen mit der Bahn verschieben und dabei ausblenden,
  // ab der Hälfte von der anderen Seite mit der nächsten Bahn hereinkommen lassen
  // nur die Card verschieben: ein Transform am Widget selbst würde die fixierte Quellenangabe mitziehen
  var widget = document.querySelector('#weather-widget .ww-card'), hole3d = null;
  function sync() {
    var f = track.scrollLeft / (track.clientWidth || 1), i = Math.round(f), frac = f - i;
    var o = Math.max(0, 1 - Math.abs(frac) * 2.5), x = -frac * track.clientWidth + 'px 0';
    widget.style.translate = x; widget.style.opacity = o;
    if (hole3d) {
      hole3d.canvas.style.translate = x; hole3d.canvas.style.opacity = o;
      [].forEach.call(slides, function (sl, j) { sl.querySelector('.hole-img').style.opacity = j === i ? 1 - o : 1; });
    }
  }
  track.addEventListener('scroll', sync, { passive: true });

  // 3D: Grafik auf fein unterteilter Fläche, Tiefenkarte (hole-depth.png, erzeugt mit depth.py) hebt Bäume/Vordergrund an
  if (window.THREE) (function () {
    var canvas = document.createElement('canvas');
    canvas.className = 'hole-3d'; canvas.setAttribute('aria-hidden', 'true');
    track.parentNode.appendChild(canvas);
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    var scene = new THREE.Scene(), A = 1122 / 896; // Höhe/Breite der Grafik
    var camera = new THREE.PerspectiveCamera(30, 1 / A, 0.1, 100);
    camera.position.z = A * 1.2 / (2 * Math.tan(15 * Math.PI / 180)); // Fläche füllt die inneren 1/1.2 der Canvas
    var loader = new THREE.TextureLoader(), pending = 2;
    loader.setCrossOrigin('anonymous');
    var loaded = function () { if (--pending === 0) { hole3d = { canvas: canvas }; sync(); } };
    var mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, A, 220, 275), new THREE.ShaderMaterial({
      uniforms: {
        map: { value: loader.load(first.querySelector('.hole-img').src, loaded) },
        depth: { value: loader.load('hole-depth.png', loaded) },
        scale: { value: 0.18 }
      },
      vertexShader: 'uniform sampler2D depth; uniform float scale; varying vec2 vUv;' +
        'void main() { vUv = uv; vec3 p = position; p.z += (texture2D(depth, uv).r - 0.5) * scale;' +
        'gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }',
      fragmentShader: 'uniform sampler2D map; varying vec2 vUv;' +
        'void main() { vec4 c = texture2D(map, vUv); if (c.a < 0.5) discard; gl_FragColor = c; }'
    }));
    scene.add(mesh);

    // leichte Neigung (±8°) und Drehung (±15°) folgen dem Zeiger im ganzen Fenster (Ausschlag relativ zur Bahnmitte,
    // voll am Fensterrand); verlässt der Zeiger das Fenster, erst nach 2 s sanft zurück in Ruhelage
    var tx = 0, ty = 0, restTimer, clamp = function (v) { return Math.max(-1, Math.min(1, v)); };
    addEventListener('pointermove', function (e) {
      var r = canvas.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var nx = clamp((e.clientX - cx) / Math.max(cx, innerWidth - cx));
      var ny = clamp((e.clientY - cy) / Math.max(cy, innerHeight - cy));
      ty = nx * 0.26; tx = ny * 0.14;
      clearTimeout(restTimer);
    }, { passive: true });
    document.documentElement.addEventListener('mouseleave', function () {
      restTimer = setTimeout(function () { tx = ty = 0; }, 2000);
    });

    (function frame() {
      requestAnimationFrame(frame);
      if (!document.body.classList.contains('view-platz') || !hole3d) return;
      var w = canvas.clientWidth, h = canvas.clientHeight;
      if (canvas.width !== Math.round(w * renderer.getPixelRatio())) renderer.setSize(w, h, false);
      mesh.rotation.x += (tx - mesh.rotation.x) * 0.08;
      mesh.rotation.y += (ty - mesh.rotation.y) * 0.08;
      renderer.render(scene, camera);
    })();
  })();

  // bei Größenänderung auf der aktuellen Bahn bleiben (resize läuft vor dem scroll-Event, idx ist also noch alt)
  addEventListener('resize', function () { track.scrollTo({ left: idx * track.clientWidth, behavior: 'instant' }); });
  update();
  sync();
})();

// Windlinien im Hintergrund: Partikel mit ausblendenden Spuren, strömen aus der im Widget angezeigten Richtung
(function () {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c = document.getElementById('wind-bg'), ctx = c.getContext('2d');
  var vx = 0, vy = 0, w, h, t = 0, ps = [];
  var spawn = function () { return { x: Math.random() * w, y: Math.random() * h, age: Math.random() * 200 }; };
  function resize() {
    var d = devicePixelRatio || 1;
    w = innerWidth; h = innerHeight; c.width = w * d; c.height = h * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    ps = Array.from({ length: Math.round(w * h / 5000) }, spawn);
  }
  function setWind(wd) {
    var b = (wd.dir + 180) * Math.PI / 180; // "aus NO" heißt: strömt nach SW
    var v = 0.6 + Math.min(wd.speed || 0, 15) * 0.3;
    vx = Math.sin(b) * v; vy = -Math.cos(b) * v;
  }
  if (weatherWidget.wind) setWind(weatherWidget.wind); // Daten kamen schon vor diesem Skript
  document.addEventListener('ww:wind', function (e) { setWind(e.detail); });
  function frame() {
    if (!document.body.classList.contains('view-platz')) return requestAnimationFrame(frame); // nur in der Platzansicht
    t += 0.003;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,.06)';
    ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(110,120,140,.22)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ps.forEach(function (p, i) {
      var a = Math.sin(p.x * .004 + t) * Math.cos(p.y * .004 - t) * .35; // leichte Verwirbelung
      var dx = vx * Math.cos(a) - vy * Math.sin(a), dy = vx * Math.sin(a) + vy * Math.cos(a);
      ctx.moveTo(p.x, p.y); p.x += dx; p.y += dy; ctx.lineTo(p.x, p.y);
      if (++p.age > 220 || p.x < 0 || p.x > w || p.y < 0 || p.y > h) { ps[i] = spawn(); ps[i].age = 0; }
    });
    ctx.stroke();
    requestAnimationFrame(frame);
  }
  addEventListener('resize', resize);
  resize();
  frame();
})();
